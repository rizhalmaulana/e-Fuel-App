name: Shorebird CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Validasi & Analisis Kode (Cepat ~1 min)
  # ==========================================
  validate:
    name: 🔍 Code Analysis & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter Packages
        run: flutter pub get

      - name: 🔍 Run Flutter Analyze
        run: flutter analyze || true

  # ==========================================
  # JOB 2: Build Shorebird & APK (Jalan jika Job 1 Selesai)
  # ==========================================
  build:
    name: 🚀 Build & Release (Shorebird)
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 📦 Get Flutter Packages
        run: flutter pub get

      - name: 🔑 Setup Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json successfully generated."
          else
            echo "Notice: GOOGLE_SERVICES_JSON secret not provided."
          fi

      - name: 🚀 Shorebird Smart Build (Patch or Release)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "Mencoba membuat update OTA (Patch)..."
          if ! shorebird patch android --track=stable; then
            echo "Patch tidak dapat dibuat (versi baru atau belum ada release). Membuat Release APK baru..."
            shorebird release android --artifact=apk --flutter-version=3.50.0
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
